# Isolated test configuration (in-memory H2, never touches MySQL)
spring.datasource.url=jdbc:h2:mem:banking_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=test-only-secret-key-for-unit-tests-32-bytes-min
jwt.expiration-ms=600000
banking.limits.withdrawal=50000.00
app.admin.username=admin
app.admin.password=Admin@12345
