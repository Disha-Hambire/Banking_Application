spring.application.name=banking-management-system
server.port=8080

# Default: in-memory H2 database (no installation needed). For MySQL run with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:banking_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT - ALWAYS override JWT_SECRET with your own value (min 32 characters) outside local development
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
jwt.expiration-ms=3600000

# Business rules
banking.limits.withdrawal=50000.00

# Admin user created on first start (override with environment variables)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

logging.level.com.banking=INFO
